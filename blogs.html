  <!-- Medium Posts Section -->
  <section id="blogs" class="content">
    <div class="text">
        <h1 class="name">Latest Blog Posts</h1>
    </div>
    <div id="medium-posts"></div>
     
  </section>

  <!-- Medium RSS Script -->
  <script>
  function extractImage(html) {
    const match = html?.match(/<img[^>]+src="([^">]+)"/);
    return match ? match[1] : "images/fallback.png";
  }

  fetch("https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@rohitha0112")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("medium-posts");

      data.items.slice(0, 3).forEach(post => {
        const image =
          extractImage(post.content) ||
          extractImage(post.description);

        container.innerHTML += `
          <a class="medium-card" href="${post.link}" target="_blank" rel="noopener">
            <div class="medium-card-text">
              <h3>${post.title}</h3>
              <p>${post.description.replace(/<[^>]+>/g, '')}</p>
              <span class="meta">Published on Medium</span>
            </div>
            <div class="medium-card-image">
              <img src="${image}" alt="Medium article preview">
            </div>
          </a>
        `;
      });
    });
</script>
